<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>player-one</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="collapsed">
    <div id="tab" class="hit" title="player-one (Ctrl+Alt+B)"><svg class="logo" viewBox="0 0 16 16"><path d="M5 3.2v9.6a.6.6 0 0 0 .9.5l7.4-4.8a.6.6 0 0 0 0-1L5.9 2.7a.6.6 0 0 0-.9.5Z" style="fill:currentColor"/></svg><div id="tab-marks"></div></div>

    <div id="rail">
      <button id="b-wins" class="rb hit" title="Windows">
        <svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6h12"/></svg>
      </button>
      <button id="b-model" class="rb hit" title="Models (Ctrl+Alt+' plays)">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="4" r="1.6"/><circle cx="3.8" cy="11.5" r="1.6"/><circle cx="12.2" cy="11.5" r="1.6"/><path d="M7.2 5.4 4.6 10M8.8 5.4l2.6 4.6M5.4 11.5h5.2"/></svg>
      </button>
      <button id="b-rec" class="rb hit" title="Record (Ctrl+Alt+S)">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><circle class="core" cx="8" cy="8" r="2.6"/></svg>
      </button>
      <button id="b-set" class="rb hit" title="Play settings">
        <svg viewBox="0 0 16 16"><path d="M3 4.5h6M12 4.5h1M3 11.5h1M7 11.5h6"/><circle cx="10.5" cy="4.5" r="1.5"/><circle cx="5.5" cy="11.5" r="1.5"/></svg>
      </button>
      <div id="b-attached" class="rpill hit" title="Attached and recording"></div>
      <button id="b-more" class="rb hit" title="More"><svg viewBox="0 0 16 16"><circle cx="4" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12" cy="8" r=".9"/></svg></button>
    </div>

    <div id="card" class="hit">
      <div class="caret"></div>
      <div id="card-body"></div>
    </div>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>
  <script src="search.js"></script>
  <script src="app.js"></script>
</body>
</html>
