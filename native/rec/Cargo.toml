[package]
name = "player-one-rec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Records a window plus keyboard/mouse/gamepad to agentpc shards; driven by player-one over JSON lines."

[dependencies]
agentpc-core.workspace = true
agentpc-capture.workspace = true
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
agentpc-record.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
